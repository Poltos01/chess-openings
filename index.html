<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Винрейты дебютов — Lichess</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#242a34; --txt:#e6e9ef; --dim:#8b95a5;
    --accent:#6cc070; --hot:#e0684b; --link:#7aa7ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:22px 26px 0}
  h1{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:12.5px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;padding:16px 26px;align-items:end}
  label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--dim);
        text-transform:uppercase;letter-spacing:.5px}
  select,input{background:var(--panel);border:1px solid var(--line);color:var(--txt);
        border-radius:7px;padding:8px 10px;font-size:13px;min-width:104px;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{background:var(--panel);border:0;color:var(--dim);padding:8px 12px;
        font-size:12.5px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#0b120c;font-weight:600}
  main{padding:0 26px 60px}
  .stat{display:flex;gap:22px;padding:6px 0 14px;color:var(--dim);font-size:12.5px;flex-wrap:wrap}
  .stat b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--bg);color:var(--dim);font-size:11px;
     text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;
     border-bottom:1px solid var(--line);z-index:2}
  th:hover{color:var(--txt)}
  th.asc::after{content:" ▲";font-size:9px}
  th.desc::after{content:" ▼";font-size:9px}
  td:first-child,th:first-child{text-align:left;white-space:normal;max-width:460px}
  tbody tr:hover{background:#1a1f27}
  .score{font-weight:600}
  .hi{color:var(--accent)} .lo{color:var(--hot)}
  .bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);
       vertical-align:middle;margin-left:8px;opacity:.55}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  .pager{display:flex;gap:6px;align-items:center;padding:16px 0 0;color:var(--dim);
         font-size:12.5px;flex-wrap:wrap}
  .pager button{background:var(--panel);border:1px solid var(--line);color:var(--txt);
         border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px;
         font-variant-numeric:tabular-nums}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager button.on{background:var(--accent);color:#0b120c;font-weight:600;border-color:var(--accent)}
  .pager .gap{padding:0 4px}
  .neg{color:var(--hot)} .pos{color:var(--accent)}
  .duel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;padding:4px 26px 18px}
  .duel .side{background:var(--panel);border:1px solid var(--line);
       border-radius:12px;padding:14px 18px;position:relative;overflow:hidden;min-width:0}
  .duel .side::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .duel .white::before{background:#e8eaf0}
  .duel .black::before{background:#6b7280}
  .duel .cap{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .duel .big{font-size:44px;font-weight:700;line-height:1.1;letter-spacing:-1.5px;
       font-variant-numeric:tabular-nums;margin:2px 0 6px}
  .duel .meta{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .duel .meta b{color:var(--txt);font-weight:600}
  .duel .track{height:8px;border-radius:4px;background:#232a34;margin-top:12px;display:flex;overflow:hidden}
  .duel .track i{display:block;height:100%}
  .duel .track .sw{background:#e8eaf0} .duel .track .sd{background:#3f4753}
  .duel .track .sb{background:#6b7280}
  .duel .gap{display:flex;flex-direction:column;justify-content:center;
       align-items:center;text-align:center;color:var(--dim);font-size:12px;padding:6px 0;white-space:nowrap}
  .duel .gap .v{font-size:22px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
  @media(max-width:820px){
    .duel{grid-template-columns:1fr}
    .duel .big{font-size:34px}
    .duel .gap{flex-direction:row;gap:10px}
  }
  footer{padding:0 26px 30px;color:var(--dim);font-size:11.5px}
  .tabs{display:flex;gap:4px;padding:2px 24px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);
        margin:2px 0 12px}
  .tabs button{background:transparent;border:1px solid transparent;border-bottom:2px solid transparent;
        color:var(--dim);padding:9px 15px;font-size:13px;cursor:pointer;border-radius:7px 7px 0 0;
        margin-bottom:-1px}
  .tabs button:hover{color:var(--txt);background:var(--panel)}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent);font-weight:600;
        background:linear-gradient(180deg,transparent 55%,rgba(108,192,112,.10))}
  #cview table{margin-top:4px}
  .cbar{display:inline-block;height:8px;border-radius:4px;background:#3f4753;
        vertical-align:middle;margin-left:8px;min-width:2px}
  .cbar.pos{background:var(--accent);opacity:.7}
  a{color:var(--link)}
</style>
</head>
<body>
<header>
  <h1>Винрейты дебютов</h1>
  <div class="sub" id="sub">загрузка…</div>
</header>

<div class="controls">
  <label>Месяц<select id="month"></select></label>
  <label>Контроль<select id="speed"></select></label>
  <label>Рейтинг<select id="band"></select></label>
  <label>Разрез
    <div class="seg" id="kind">
      <button data-v="pair" class="on">1-й ход / ответ</button>
      <button data-v="eco">дебют по ECO</button>
    </div>
  </label>
  <label>Бэнд
    <div class="seg" id="mode">
      <button data-v="avg" class="on">по среднему</button>
      <button data-v="strict">оба в бэнде</button>
    </div>
  </label>
  <label>Мин. партий<input id="minn" type="number" value="100" min="1" step="50" style="min-width:90px"></label>
  <label>На странице<select id="persel">
      <option value="50">50</option><option value="100">100</option>
      <option value="200">200</option><option value="0">все</option>
  </select></label>
  <label>Поиск<input id="q" type="search" placeholder="сицилианская…" style="min-width:170px"></label>
</div>

<nav class="tabs" id="ctabs">
  <button data-t="debuts" class="on">Винрейты дебютов</button>
  <button data-t="bands">Цвет по бэндам</button>
  <button data-t="popular">Популярные дебюты</button>
  <button data-t="cross">Дебют во всех бэндах</button>
</nav>

<main>
  <div class="duel" id="duel"></div>
  <div class="stat" id="stat"></div>

  <div id="viewDebuts">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Нет данных под эти фильтры — снизьте минимальное число партий.</div>
    <div class="pager" id="pager"></div>
  </div>

  <div class="stat" id="cstat"></div>
  <div id="cview"></div>
</main>

<section id="colourBlock" hidden></section>

<footer>
  Источник: официальные дампы Lichess (<a href="https://database.lichess.org" target="_blank" rel="noopener">database.lichess.org</a>), CC0.
  score = (победы + ½ ничьих) / партии. W/D/L — с точки зрения белых.
  Партии с разрывом рейтинга &gt; 80 исключены, кроме игр с рейтингом 2400+.
</footer>

<script>
const state = {kind:"pair", mode:"avg", sort:"score", dir:-1, page:0,
               index:null, slice:null, cache:new Map()};
const $ = id => document.getElementById(id);
const num = x => x.toLocaleString("ru-RU");
const pct = x => (x*100).toFixed(1) + "%";

function score(e){ return (e[2] + 0.5*e[3]) / e[1]; }   // e = [name,n,w,d,l]

function loadColour(month, mode){
  const key = "colour:" + month;
  if (!state.cache.has(key))
    state.cache.set(key, fetch(`data/colour/${month}/bands.json`, {cache:"no-store"})
      .then(r => r.ok ? r.json() : null).catch(() => null));
  return state.cache.get(key).then(j => j ? j[mode] || [] : []);
}

function renderColour(){
  const tab = state.tab || "debuts";
  const isDeb = tab === "debuts";
  $("viewDebuts").hidden = !isDeb;
  $("cstat").hidden = isDeb;
  $("cview").hidden = isDeb;
  if (isDeb){ $("cstat").textContent = ""; $("cview").innerHTML = ""; return; }
  if (tab === "bands") return renderBands();
  return renderCross(tab);
}

// Tab 2: White vs Black across every band
function renderBands(){
  loadColour($("month").value, state.mode).then(rows => {
    if (!rows.length){ $("cview").innerHTML = ""; $("cstat").textContent = ""; return; }
    const tot = rows.reduce((s,r) => s + r[1], 0) || 1;
    $("cstat").textContent =
      `${$("month").value} · ${state.mode === "avg" ? "по среднему" : "оба в бэнде"} · все контроли`;
    $("cview").innerHTML = `<table>
      <thead><tr><th style="cursor:default">Бэнд</th><th>партий</th>
        <th>белые выигрывают</th><th>ничьи</th>
        <th>белые score</th><th>чёрные score</th><th>перевес белых</th></tr></thead>
      <tbody>${rows.map(([band, n, w, d, l]) => {
        const wp = w/n, dp = d/n, lp = l/n;
        const ws = wp + dp/2, bs = lp + dp/2, lead = (ws - bs) * 100;
        const sel = String(band) === $("band").value;
        return `<tr ${sel ? 'style="background:#1d2530"' : ""}>
          <td>${band}–${band+99}${sel ? " ←" : ""}</td>
          <td>${num(n)}</td>
          <td>${pct(wp)}</td><td>${pct(dp)}</td>
          <td>${pct(ws)}</td><td>${pct(bs)}</td>
          <td class="${lead>=0?'pos':'neg'}">${lead>=0?"+":""}${lead.toFixed(1)} п.п.</td>
        </tr>`;
      }).join("")}</tbody></table>`;
  });
}

function loadCross(tab){
  // tabs are pair-based or eco-based; the files are named by the cut, not the tab
  const kind = state.kind || "pair";
  const key = "cross:" + kind;
  if (!state.cache.has(key))
    state.cache.set(key, fetch(`data/cross/${kind}.json`, {cache:"no-store"})
      .then(r => r.ok ? r.json() : null).catch(() => null));
  return state.cache.get(key);
}

// Tab 3: most popular openings — the ones that show up in every band
function renderCross(tab){
  loadCross(tab).then(cr => {
    if (!cr){ $("cview").innerHTML = ""; $("cstat").textContent = ""; return; }
    const kind = cr.meta.kind;
    const label = kind === "pair" ? "первый ход / ответ" : "дебют по ECO";
    const bands = Object.keys(cr.bands).map(Number).sort((a,b) => a-b);

    if (tab === "popular"){
      $("cstat").textContent =
        `${cr.meta.month} · ${label} · blitz · порог ${cr.meta.min_n} партий в бэнде`;
      const rows = [...cr.cross].sort((a,b) => b[2]-a[2]);
      $("cview").innerHTML = `<table>
        <thead><tr><th style="cursor:default">дебют</th><th>бэндов покрыто</th>
          <th>партий всего</th><th>score белых</th><th></th></tr></thead>
        <tbody>${rows.map(([name, nb, n, s]) => `<tr>
          <td>${name}</td>
          <td>${nb} / ${bands.length}</td>
          <td>${num(n)}</td>
          <td class="${s>=0.5?'pos':'neg'}">${pct(s)}</td>
          <td style="text-align:left"><span class="cbar ${s>=0.5?'pos':''}" style="width:${Math.max(2,(s-0.45)*600)}px"></span></td>
        </tr>`).join("")}</tbody></table>`;
      return;
    }

    // Tab 4: one opening's score in every band
    const names = cr.cross.map(c => c[0]);
    $("cstat").innerHTML = `${cr.meta.month} · ${label} · blitz ·
      выбрать дебют: <select id="csel" style="min-width:220px">
      ${names.map(nm => `<option ${nm===state.crossName?"selected":""}>${nm}</option>`).join("")}
      </select>`;
    const cur = state.crossName && names.includes(state.crossName) ? state.crossName : names[0];
    state.crossName = cur;
    $("csel").onchange = e => { state.crossName = e.target.value; renderCross(tab); };

    const byBand = new Map();
    for (const b of bands)
      for (const e of (cr.bands[b] || []))
        if (e[0] === cur) byBand.set(b, e);

    $("cview").innerHTML = `<table>
      <thead><tr><th style="cursor:default">Бэнд</th><th>партий</th>
        <th>W%</th><th>D%</th><th>L%</th><th>score белых</th><th>score чёрных</th></tr></thead>
      <tbody>${bands.map(b => {
        const e = byBand.get(b);
        if (!e) return `<tr style="color:#4a5260"><td>${b}–${b+99}</td>
          <td colspan="6" style="text-align:left">нет данных (${cr.meta.min_n}+ партий в бэнде)</td></tr>`;
        const [, n, w, d, l] = e;
        const ws = (w + d/2) / n;
        return `<tr>
          <td>${b}–${b+99}</td><td>${num(n)}</td>
          <td>${pct(w/n)}</td><td>${pct(d/n)}</td><td>${pct(l/n)}</td>
          <td class="${ws>=0.5?'pos':'neg'}">${pct(ws)}</td><td>${pct(1-ws)}</td>
        </tr>`;
      }).join("")}</tbody></table>`;
  });
}

function boot(){
  fetch("data/index.json", {cache:"no-store"})
  .then(r => r.json())
  .then(idx => {
  state.index = idx;
  $("sub").textContent = `данные: ${idx.months.at(-1)} · обновлено ${idx.generated_at}`;
  for (const m of idx.months) $("month").add(new Option(m, m));
  for (const s of idx.speeds) $("speed").add(new Option(s, s));
  for (const b of idx.bands) $("band").add(new Option(`${b}–${b+99}`, b));
  $("month").value = idx.months.at(-1);
  $("speed").value = idx.speeds.includes("blitz") ? "blitz" : idx.speeds[0];
  $("band").value = idx.bands.includes(1100) ? 1100 : idx.bands[0];
  for (const sel of ["month","speed","band","minn","q","persel"])
    $(sel).oninput = () => { state.page = 0; render(); renderColour(); };
  for (const g of ["kind","mode"])
    $(g).onclick = e => {
      if (!e.target.dataset.v) return;
      state[g] = e.target.dataset.v;
      state.page = 0;
      state.crossName = null;
      [...$(g).children].forEach(b => b.classList.toggle("on", b === e.target));
      render();
      renderColour();
    };
  render();
  renderColour();
  $("ctabs").onclick = e => {
    const t = e.target.dataset.t;
    if (!t) return;
    state.tab = t;
    [...$("ctabs").children].forEach(b => b.classList.toggle("on", b === e.target));
    renderColour();
  };
  });
}

async function loadSlice(){
  const key = `${$("month").value}/${$("speed").value}/${$("band").value}`;
  if (state.cache.has(key)) return state.cache.get(key);
  try {
    const r = await fetch(`data/${key}.json`, {cache:"no-store"});
    if (!r.ok) return null;
    const j = await r.json();
    state.cache.set(key, j);
    return j;
  } catch { return null; }
}

const COLS = [
  ["name","Дебют",0],["n","N",1],["w","W%",1],["d","D%",1],["l","L%",1],
  ["score","score белых",1],["bscore","score чёрных",1],["delta","Δ к базе",1]
];

function renderPager(pages, total, from, count){
  if (!total){ $("pager").innerHTML = ""; return; }
  const btn = (label, p, on, dis) => {
    const at = dis ? ' disabled' : '';
    const cls = on ? ' class=on' : '';
    return `<button data-p=${p}${at}${cls}>${label}</button>`;
  };
  const out = [btn("‹", Math.max(0, state.page-1), false, state.page === 0)];
  const want = [0, state.page-1, state.page, state.page+1, pages-1]
                 .filter(p => p >= 0 && p < pages);
  const nums = [...new Set(want)].sort((a,b) => a-b);
  let last = -2;
  for (const p of nums){
    if (p - last > 1) out.push('<span class="gap">…</span>');
    out.push(btn(String(p+1), p, p === state.page, false));
    last = p;
  }
  out.push(btn("›", Math.min(pages-1, state.page+1), false, state.page === pages-1));
  out.push(`<span class="gap">строк ${num(from+1)}–${num(from+count)} из ${num(total)}</span>`);
  $("pager").innerHTML = out.join("");
  $("pager").querySelectorAll("button[data-p]").forEach(b => {
    if (b.disabled) return;
    b.onclick = () => { state.page = +b.dataset.p; render(); };
  });
}

function render(){
  loadSlice().then(sl => {
    state.slice = sl;
    if (sl) $("sub").textContent =
      `данные: ${sl.meta.label} · ${$("speed").value} · бэнд ${$("band").value}–${+$("band").value+99}`;
    const minN = +$("minn").value || 1;
    const q = $("q").value.trim().toLowerCase();
    const rows = sl ? (sl[state.mode][state.kind] || []).filter(e =>
        e[1] >= minN && (!q || e[0].toLowerCase().includes(q))) : [];
    const totals = sl ? sl.meta["totals_" + state.mode] : [0,0,0,0];
    const base = totals[0] ? score(totals) : 0.5;

    const view = rows.map(e => {
      const s = score(e);
      return {name:e[0], n:e[1], w:e[2]/e[1], d:e[3]/e[1], l:e[4]/e[1],
              score:s, bscore:1-s, delta:s-base};
    });

    // --- colour duel: White % vs Black % for the whole selected slice ---
    if (totals[0]){
      const w = totals[1] / totals[0], d = totals[2] / totals[0], l = totals[3] / totals[0];
      const ws = w + d/2, bs = l + d/2;
      const lead = (ws - bs) * 100;
      $("duel").innerHTML = `
        <div class="side white">
          <div class="cap">Винрейт белых</div>
          <div class="big">${pct(w)}</div>
          <div class="meta">score с ничьими <b>${pct(ws)}</b> · побед <b>${num(totals[1])}</b></div>
          <div class="track"><i class="sw" style="width:${w*100}%"></i><i class="sd" style="width:${d*100}%"></i><i class="sb" style="width:${l*100}%"></i></div>
        </div>
        <div class="gap">
          <span>перевес белых</span>
          <span class="v" style="color:${lead>=0?'#6cc070':'#e0684b'}">${lead>=0?'+':''}${lead.toFixed(1)} п.п.</span>
          <span>ничьих ${pct(d)}</span>
        </div>
        <div class="side black">
          <div class="cap">Винрейт чёрных</div>
          <div class="big">${pct(l)}</div>
          <div class="meta">score с ничьими <b>${pct(bs)}</b> · побед <b>${num(totals[3])}</b></div>
          <div class="track"><i class="sw" style="width:${w*100}%"></i><i class="sd" style="width:${d*100}%"></i><i class="sb" style="width:${l*100}%"></i></div>
        </div>`;
    } else {
      $("duel").innerHTML = "";
    }
    const k = state.sort, dir = state.dir;
    view.sort((a,b) => (typeof a[k] === "string" ? a[k].localeCompare(b[k],"ru") : a[k]-b[k]) * dir);

    $("head").innerHTML = COLS.map(([key,label]) =>
      `<th data-k="${key}" class="${key===k?(dir>0?'asc':'desc'):''}">${label}</th>`).join("");
    [...$("head").children].forEach(th => th.onclick = () => {
      const key = th.dataset.k;
      if (state.sort === key) state.dir *= -1; else { state.sort = key; state.dir = key === "name" ? 1 : -1; }
      state.page = 0;
      render();
    });

    const perOpt = +$("persel").value;
    const per = perOpt > 0 ? perOpt : Math.max(1, view.length);
    const pages = Math.max(1, Math.ceil(view.length / per));
    if (state.page > pages - 1) state.page = pages - 1;
    const from = state.page * per;
    const shown = view.slice(from, from + per);
    $("body").innerHTML = shown.map(r => {
      const w = Math.max(2, Math.round(r.score*70));
      const cls = r.score >= base ? "hi" : "lo";
      const dcls = r.delta > 0 ? "pos" : "neg";
      return `<tr>
        <td>${r.name}</td>
        <td>${num(r.n)}</td>
        <td>${pct(r.w)}</td><td>${pct(r.d)}</td><td>${pct(r.l)}</td>
        <td class="score ${cls}">${pct(r.score)}<span class="bar" style="width:${w}px"></span></td>
        <td>${pct(r.bscore)}</td>
        <td class="${dcls}">${r.delta>0?"+":""}${(r.delta*100).toFixed(1)}</td>
      </tr>`;
    }).join("");

    $("empty").hidden = shown.length > 0;
    renderPager(pages, view.length, from, shown.length);
    const gamesInTable = rows.reduce((s,e) => s + e[1], 0);
    $("stat").innerHTML =
      `<span>партий в выборке: <b>${num(totals[0])}</b></span>
       <span>строк под фильтром: <b>${num(rows.length)}</b> (${num(gamesInTable)} партий)</span>
       <span>база: <b>${pct(base)}</b></span>
       <span>бэнд: <b>${$("band").value}–${+$("band").value+99}</b>, режим: <b>${state.mode === "avg" ? "по среднему" : "оба в бэнде"}</b></span>`;
  });
}

boot();
</script>
</body>
</html>
